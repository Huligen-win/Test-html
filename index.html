}

}

}
.hero h1 {

}

.gallery { padding: 90px 24px; min-height: calc(100vh - 74px); }

.testimonials { padding: 90px 24px; background: var(--ivory-dark); min-height: calc(100vh - 74px); }

.testimonial-author { font-size: 13px; font-weight: 600; color: var(--rose-dark); }

/* Contact */
.contact { padding: 90px 24px; min-height: calc(100vh - 74px); }

        blocks: [
          { id: 'section', label: 'Sektion', category: 'Layout', content: '<section style="padding:60px 24px;"><div style="max-width:1140px;margin:0 auto;"><h2>Neue Sektion</h2><p>Text hier einfügen …</p></div></section>' },
          { id: 'text', label: 'Text', category: 'Basis', content: '<p>Neuer Textabschnitt – hier klicken und bearbeiten.</p>' },
          { id: 'heading', label: 'Überschrift', category: 'Basis', content: '<h2>Neue Überschrift</h2>' },
          { id: 'image', label: 'Bild', category: 'Basis', content: { type: 'image' } },
          { id: 'button', label: 'Button', category: 'Basis', content: '<a class="btn-primary" href="#">Button-Text</a>' },
          { id: 'two-col', label: '2 Spalten', category: 'Layout', content: '<div style="display:flex;gap:24px;padding:40px 24px;"><div style="flex:1;">Spalte 1</div><div style="flex:1;">Spalte 2</div></div>' }
        ]
      },
      pageManager: {
        pages: pages.map(function (p) {
          return { id: p.id, name: p.name, component: headerHtml + p.body + footerHtml, styles: pageCss };
        }),
        selected: 'start'
      },
    });

    // ---------- Navigation innerhalb des Editors: Klick auf Menüpunkt wechselt die Seite ----------
    var pendingAnchor = null;

    function highlightActiveNav(doc, pageId) {
      var links = doc.querySelectorAll('[data-page]');
      links.forEach(function (el) {
        el.classList.toggle('active', el.getAttribute('data-page') === pageId);
      });
    }

    function bindNavClicks(win, pageId) {
      var doc = win.document;
      highlightActiveNav(doc, pageId);
      doc.body.addEventListener('click', function (e) {
        var link = e.target.closest('[data-page]');
        if (!link) return;
        e.preventDefault();
        var targetPage = link.getAttribute('data-page');
        var anchor = link.getAttribute('data-anchor');
        if (targetPage === editor.Pages.getSelected().getId() && anchor) {
          var el = doc.getElementById(anchor);
          el && el.scrollIntoView({ behavior: 'smooth' });
          return;
        }
        pendingAnchor = anchor || null;
        editor.Pages.select(targetPage);
      });
    }

    editor.on('canvas:frame:load:body', function (e) {
      var pageId = editor.Pages.getSelected().getId();
      bindNavClicks(e.window, pageId);
      if (pendingAnchor) {
        var target = pendingAnchor;
        pendingAnchor = null;
        setTimeout(function () {
          var el = e.window.document.getElementById(target);
          el && el.scrollIntoView({ behavior: 'smooth' });
        }, 60);
      }
    });

    // ---------- Eigene Seiten-Schaltfläche oben (unabhängig vom Editor-Panel) ----------
    var switcherButtons = document.querySelectorAll('#page-switcher button[data-page]');
    switcherButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        editor.Pages.select(btn.getAttribute('data-page'));
      });
    });
    editor.on('page:select', function (page) {
      var id = page.getId();
      switcherButtons.forEach(function (btn) {
        btn.classList.toggle('active', btn.getAttribute('data-page') === id);
      });
    });

    // ---------- Export: erzeugt aus den Seiten echte, eigenständige HTML-Dateien ----------
    var fileNameByPage = {
      start: 'index.html',
      leistungen: 'leistungen.html',
      galerie: 'galerie.html',
      bewertungen: 'bewertungen.html',
      kontakt: 'kontakt.html'
    };
    var titleByPage = {
      start: 'Serenity Decor – Hochzeitsfloristik & Dekoration in Marburg',
      leistungen: 'Leistungen – Serenity Decor',
      galerie: 'Galerie – Serenity Decor',
      bewertungen: 'Bewertungen – Serenity Decor',
      kontakt: 'Kontakt – Serenity Decor'
    };

    function toRealLink(html) {
      // Ersetzt die editor-internen data-page-Links durch echte href-Ziele
      Object.keys(fileNameByPage).forEach(function (pid) {
        var target = fileNameByPage[pid];
        html = html.split('data-page="' + pid + '" data-anchor="ueber-uns" href="#"')
          .join('href="index.html#ueber-uns"');
        html = html.split('data-page="' + pid + '" href="#"')
          .join('href="' + target + '"');
      });
      return html;
    }

    function buildStandaloneDoc(pageId) {
      var comp = editor.Pages.get(pageId).getMainComponent();
      var html = editor.getHtml({ component: comp });
      html = toRealLink(html);
      return '<!DOCTYPE html>\n<html lang="de">\n<head>\n<meta charset="UTF-8" />\n' +
        '<meta name="viewport" content="width=device-width, initial-scale=1" />\n' +
        '<title>' + titleByPage[pageId] + '</title>\n' +
        '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" />\n' +
        '<style>' + pageCss + '</style>\n</head>\n<body>\n' + html + '\n</body>\n</html>\n';
    }

    function downloadFile(filename, content) {
      var blob = new Blob([content], { type: 'text/html;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }

    document.getElementById('export-all-btn').addEventListener('click', function () {
      pages.forEach(function (p, i) {
        setTimeout(function () {
          downloadFile(fileNameByPage[p.id], buildStandaloneDoc(p.id));
        }, i * 300); // leicht versetzt, damit der Browser nicht alle Downloads gleichzeitig blockiert
      });
    });
  </script>
</body>
</html>
